version: '3.8'

services:
  # Service Backend (Express JS)
  backend:
    build: .                 # Menggunakan Dockerfile di folder backend
    ports:
      - "5000:5000"           # Port server Express
    volumes:
      - .:/app
      - ../Frontend:/Frontend:ro
      - /app/node_modules
    environment:
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URL=mongodb://mongodb:27017/gamukis
      - MYSQL_HOST=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DATABASE=gamukis
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    command: npm run dev      # Dipastikan menjalankan nodemon di container
    depends_on:
      mysql:
        condition: service_healthy   # Menunggu MySQL siap menerima koneksi
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy

  # 1. Service Redis
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 2. Service MongoDB
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. Service MySQL
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gamukis
    volumes:
      - mysql_data:/var/lib/mysql
    # Healthcheck wajib agar backend tidak crash saat MySQL baru booting
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  mongo_data:
  mysql_data:
